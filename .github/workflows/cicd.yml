name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  # PR 생성/수정 시 테스트만 수행
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 설치 및 Gradle 캐시 적용
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 4. 테스트 실행
      - name: Run tests
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
          SPRING_PROFILES_ACTIVE: test
          SPRING_KAFKA_LISTENER_AUTO_STARTUP: false
        run: ./gradlew test --no-daemon --build-cache


  # main 브랜치 merge 후 빌드 및 배포 수행
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 설치 및 Gradle 캐시 적용
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 4. 실행 가능한 JAR 생성
      - name: Build application
        env:
          JWT_SECRET_KEY: ${{ secrets.JWT_SECRET_KEY }}
        run: ./gradlew bootJar --no-daemon --build-cache

      # 5. Docker Hub 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 6. 백엔드 Docker 이미지 빌드
      - name: Build Docker image
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/enrollment-system:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/enrollment-system:${{ github.sha }} \
            .

      # 7. Docker Hub에 백엔드 이미지 업로드
      - name: Push Docker image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/enrollment-system:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/enrollment-system:${{ github.sha }}

      # 8. Ubuntu EC2에 자동 배포
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            cd /home/ubuntu/enrollment_system

            git pull origin main

            docker compose pull

            docker compose up -d --build --force-recreate

            docker image prune -f

            docker compose ps
