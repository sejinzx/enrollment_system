name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1. GitHub 저장소 코드 가져오기
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. JDK 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      # 4. 테스트 실행
      - name: Run tests
        run: ./gradlew test

      # 5. 애플리케이션 빌드
      - name: Build application
        run: ./gradlew clean build -x test

      # 6. Docker Hub 로그인
      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 7. Docker 이미지 빌드
      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          docker build \
            -t ${{ secrets.DOCKER_USERNAME }}/enrollment-system:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/enrollment-system:${{ github.sha }} \
            .

      # 8. Docker Hub에 이미지 업로드
      - name: Push Docker image
        if: github.event_name == 'push'
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/enrollment-system:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/enrollment-system:${{ github.sha }}